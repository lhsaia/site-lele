  <ellipse cx="62" cy="45" rx="7" ry="9" fill="#dc2626" transform="rotate(6 62 45)"/>

  <!-- Cavidade Nasal em Triângulo Invertido -->
  <path d="M 50 54 L 46 64 C 47 65.5, 53 65.5, 54 64 Z" fill="#dc2626"/>

  <!-- Separação dos Dentes -->
  <line x1="43" y1="72" x2="43" y2="83" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="71" x2="50" y2="83" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="57" y1="72" x2="57" y2="83" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
</svg>
