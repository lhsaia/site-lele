<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Círculo Vermelho de Fundo -->
  <circle cx="50" cy="50" r="48" fill="#dc2626"/>
  
  <!-- Silhueta da Caveira Preta -->
  <!-- Crânio e Maxilar integrados -->
  <path d="M 50 16
           C 31 16, 21 28, 21 44
           C 21 54, 27 60, 33 64
           C 34 66, 35 78, 36 82
           C 37 84, 63 84, 64 82
           C 65 78, 66 66, 67 64
           C 73 60, 79 54, 79 44
           C 79 28, 69 16, 50 16 Z" 
        fill="#0c0d10" />

  <!-- Órbitas Oculares (Recortes no formato) -->
